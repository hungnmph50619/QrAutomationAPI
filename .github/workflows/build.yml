name: Build .NET 8
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore QrAutomationAPI/QrAutomationAPI.csproj
      - name: Build
        run: dotnet build QrAutomationAPI/QrAutomationAPI.csproj --configuration Release --no-restore
